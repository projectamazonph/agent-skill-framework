name: "Agent Skill Framework"
version: "1.0.0"
specification: "https://agentskills.io/specification"
license: "MIT"
orchestrator: "suite-orchestrator"
portable_core: true

# Combined from 5 source repos:
# - agent-skills-library     (agent-skills, mattpocock-skills, plugins, cli-tools, mcp-servers)
# - agent-skill-suite        (suite-core skills, adapters, schemas)
# - engineering-standards    (engineering quality gates, integrations)
# - design-skill-pack        (design system skills, docs)
# - project-bootstrap-full   (project bootstrap skill, reference templates)

install_order:
  # Phase 1: Foundation — bootstrap the project
  - "project-bootstrap-full"

  # Phase 2: Engineering standards — quality gates and discipline
  - "engineering-quality-gates"
  - "solid-code-design"
  - "test-driven-development"
  - "loop-engineering"
  - "quality-gates"
  - "engineering-standards-orchestrator"

  # Phase 3: Suite core — orchestration and control plane
  - "engineering-orchestrator"
  - "implementation-council"
  - "artifact-production"
  - "local-memory"
  - "conversation-compiler"
  - "agent-control-plane"
  - "suite-orchestrator"

  # Phase 4: Design — design system and taste
  - "design-system-master"
  - "amazon-ad-console-redesign"

  # Phase 5: Agent skills — community library skills
  - "composio-cli"
  - "design-taste-frontend"
  - "high-end-visual-design"
  - "redesign-existing-projects"
  - "solid"
  - "tdd"

  # Phase 6: Precision workflow specialist
  - "precision-workflow"

skills:
  - name: "suite-orchestrator"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Classify tasks, route skills, preserve state, and enforce suite completion."

  - name: "agent-control-plane"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Maintain workspaces, permissions, commands, state, logs, and failure recovery."

  - name: "conversation-compiler"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Convert raw conversations and notes into governed execution packages."

  - name: "engineering-orchestrator"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Coordinate software work through architecture, TDD, loops, and gates."

  - name: "implementation-council"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Pressure-test plans, code, migrations, and releases through expert debate."

  - name: "artifact-production"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Create, render, version, and verify professional artifacts."

  - name: "local-memory"
    category: "suite-core"
    source: "projectamazonph/agent-skill-suite"
    responsibility: "Capture, retrieve, curate, and forget durable local agent memory."

  - name: "engineering-quality-gates"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Return PASS or BLOCKED from required engineering evidence."

  - name: "engineering-standards-orchestrator"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Orchestrates all 5 engineering standards skills as one cohesive workflow."

  - name: "loop-engineering"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Control iteration size, evidence, observation, and adjustment."

  - name: "solid-code-design"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Define proportionate responsibilities, contracts, extension seams, and dependency direction."

  - name: "test-driven-development"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Prove one behavior through a valid Red-Green-Refactor cycle."

  - name: "quality-gates"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Return PASS or BLOCKED from required engineering evidence."

  - name: "precision-workflow"
