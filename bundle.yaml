name: "Agent Skill Framework"
version: "1.0.0"
specification: "https://agentskills.io/specification"
license: "MIT"
orchestrator: "suite-orchestrator"
portable_core: true

# =============================================================================
# Agent Skill Framework — Combined from 5 GitHub source repos + 5 own skills
#
# Sources:
# 1. projectamazonph/agent-skills-library   (46 skills: agent-skills + mattpocock-skills)
# 2. projectamazonph/agent-skill-suite        (11 skills: suite-core)
# 3. projectamazonph/engineering-standards    (6 skills + 1 specialist)
# 4. projectamazonph/design-skill-pack        (2 design skills)
# 5. projectamazonph/project-bootstrap-full   (1 bootstrap skill)
# 6. skills-lock.json (user's personal curated set) (5 own skills)
#
# Total: 71 unique SKILL.md files · 0 duplicate names
# =============================================================================

install_order:
  # --- Phase 1: Bootstrap — foundation for a new project ---
  - "project-bootstrap-full"

  # --- Phase 2: Engineering standards — quality discipline ---
  - "engineering-quality-gates"
  - "solid-code-design"
  - "tdd-workflow"
  - "loop-engineering-v2"
  - "precision-workflow"
  - "engineering-standards-orchestrator"

  # --- Phase 3: Suite core — orchestration & control plane ---
  - "test-driven-development"
  - "solid-design"
  - "loop-engineering"
  - "quality-gates"
  - "engineering-orchestrator"
  - "implementation-council"
  - "artifact-production"
  - "local-memory"
  - "conversation-compiler"
  - "agent-control-plane"
  - "suite-orchestrator"

  # --- Phase 4: Design system ---
  - "design-system-master"
  - "amazon-ad-console-redesign"

  # --- Phase 5: Agent library skills ---
  - "composio-cli"
  - "design-taste-frontend"
  - "high-end-visual-design"
  - "redesign-existing-projects"
  - "solid"
  - "tdd"

skills:
  # === ENGINEERING STANDARDS (from projectamazonph/engineering-standards) ===
  - name: "engineering-quality-gates"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Return PASS or BLOCKED from required engineering evidence."

  - name: "engineering-standards-orchestrator"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Orchestrates all 6 engineering standards skills as one cohesive workflow."

  - name: "loop-engineering-v2"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Engineering-standards variant of loop-engineering. Routes to tdd-workflow, solid-code-design, engineering-quality-gates."

  - name: "solid-code-design"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Define proportionate responsibilities, contracts, extension seams, and dependency direction."

  - name: "tdd-workflow"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Prove one behavior through a valid Red-Green-Refactor cycle. Refactoring belongs to review stage."

  - name: "precision-workflow"
    category: "engineering"
    source: "projectamazonph/engineering-standards"
    responsibility: "Specialist skill for long-task execution, memory management, safety, and artifact production."

